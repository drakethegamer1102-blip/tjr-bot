name: TJR Bot (paper)

# Runs on GitHub's free runners. Times are UTC, tuned for US Eastern DAYLIGHT
# time (EDT = UTC-4). In winter (EST) shift the windows +1 hour (see DEPLOY.md).
on:
  # Intraday scheduling (every-5-min scans, daily/weekly recaps) is handled by
  # cron-job.org calling the workflow_dispatch API below — GitHub's built-in schedule
  # was too unreliable for time-critical 5-min trade scans.
  #
  # ORB FUTURES is a once-a-day, AFTER-CLOSE paper sim, so a few minutes of GitHub
  # schedule jitter is harmless — it uses GitHub's built-in cron (no external timer /
  # cron-job.org account needed). Runs 20:20 UTC = 4:20 PM ET (EDT). In winter (EST)
  # bump to '20 21 * * 1-5' for a true after-close run (see DEPLOY.md DST note).
  # If GitHub proves unreliable for it, move to a cron-job.org entry (mode=orb-futures).
  schedule:
    - cron: "20 20 * * 1-5"     # 4:20 PM ET (EDT), Mon-Fri -> ORB FUTURES paper sim
  workflow_dispatch:
    inputs:
      mode:
        description: "once | summary | weekly | healthcheck | strategy-report | review | morning-brief | orb-futures"
        default: "healthcheck"
        type: string

concurrency:
  group: tjr-bot
  cancel-in-progress: false        # never interrupt a run mid-order

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # review mode commits auto-tuned config.yaml back
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Daily summary
        if: ${{ github.event.schedule == '5 20 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'summary') }}
        run: python scripts/run_bot.py --summary

      - name: Weekly recap
        if: ${{ github.event.schedule == '10 20 * * 5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly') }}
        run: python scripts/run_bot.py --weekly

      - name: Connectivity self-test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'healthcheck' }}
        run: python scripts/healthcheck.py

      - name: Strategy performance report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'strategy-report' }}
        run: python scripts/strategy_report.py --telegram

      # Pre-open news digest (add a cron-job.org entry ~9:00 AM ET, Mon-Fri).
      - name: Morning news brief
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'morning-brief' }}
        run: python scripts/morning_brief.py --telegram

      # Nightly self-improvement: analyse the day's trades, adjust strategy config
      # within guardrails (never risk rails, paper-only), run tests, and COMMIT the
      # change back so the next day's runs pick it up. Pushes a summary to Telegram.
      - name: Autonomous strategy review (apply + commit)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'review' }}
        env:
          # Only learn from trades on/after the last strategy-code change (2026-07-09:
          # capped marketable-limit entries + news gate; before that the 07-08
          # APEX/RIPTIDE launch), so stale losses from the old execution can't
          # auto-disable a now-corrected strategy.
          EVAL_SINCE: "2026-07-09"
        run: |
          set -e
          cp config.yaml /tmp/config.before.yaml
          python scripts/review_bot.py --apply --telegram --days 14
          # Verify the bot still imports + tests pass before committing any change.
          python -m pytest tests/ -q
          if ! diff -q /tmp/config.before.yaml config.yaml >/dev/null 2>&1; then
            git config user.name "tjr-bot[bot]"
            git config user.email "tjr-bot@users.noreply.github.com"
            git add config.yaml
            git commit -m "chore(review): auto-tune strategy config [skip ci]"
            git push
            echo "config.yaml updated and committed."
          else
            echo "No config change to commit."
          fi

      - name: Trading cycle
        if: ${{ (github.event_name == 'schedule' && github.event.schedule != '5 20 * * 1-5' && github.event.schedule != '10 20 * * 5' && github.event.schedule != '20 20 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'once') }}
        run: python scripts/run_bot.py --once

      # FUTURES paper sims (prop-firm prep) — run once daily AFTER the close via GitHub's
      # built-in cron (20:20 UTC = 4:20 PM ET, Mon-Fri) or on demand (mode=orb-futures).
      # Two paper products, each its own Telegram message, both ledgers committed back so
      # equity persists across GitHub's stateless runs. Paper/simulation only:
      #   1. ORB FUTURES        — intraday ORB on micro index futures (MES/MNQ/M2K/MYM).
      #   2. FUTURES DAILY      — the 3 validated daily edges DAYBREAK / REBOUND / GAPFILL
      #                           on real ES=F data, one combined review message.
      - name: Futures paper sims
        if: ${{ github.event.schedule == '20 20 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'orb-futures') }}
        run: |
          set -e
          python scripts/orb_futures_paper.py --days 1 --telegram || true
          python scripts/futures_daily_paper.py --days 5 --telegram || true
          git config user.name "tjr-bot[bot]"
          git config user.email "tjr-bot@users.noreply.github.com"
          CHANGED=""
          for f in orb_futures_ledger.json futures_daily_ledger.json; do
            if [ -n "$(git status --porcelain "$f")" ]; then git add "$f"; CHANGED="yes"; fi
          done
          if [ -n "$CHANGED" ]; then
            git commit -m "chore(futures): paper ledger update [skip ci]"
            git push
            echo "Futures ledgers committed."
          else
            echo "No new futures trades to record."
          fi

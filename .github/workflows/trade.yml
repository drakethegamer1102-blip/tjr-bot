name: TJR Bot (paper)

# Runs on GitHub's free runners. Times are UTC, tuned for US Eastern DAYLIGHT
# time (EDT = UTC-4). In winter (EST) shift the windows +1 hour (see DEPLOY.md).
on:
  # Scheduling is driven LOCALLY by a launchd timer on the user's Mac (com.drake.tjr-cron ->
  # scripts/dispatch_cron.sh), which calls `gh workflow run` at exact ET times. GitHub's own
  # cron was too unreliable here (2026-09-29: it dropped the */5 intraday scan almost entirely
  # and delayed close jobs 2-3h), so the native `schedule:` block was removed to avoid
  # double-firing. The dispatch script fires: once (every 5m, 09:30-16:00 ET), rebound-open
  # (09:35), rebound-close (15:55), summary (16:05), weekly (Fri 16:10), orb-futures (16:20),
  # review (16:30). Requires the Mac to be on during market hours. resolve-mode below still
  # maps modes for both triggers.
  workflow_dispatch:
    inputs:
      mode:
        description: "once | summary | weekly | healthcheck | strategy-report | review | morning-brief | orb-futures | rebound-open | rebound-close"
        default: "healthcheck"
        type: string

concurrency:
  group: tjr-bot
  cancel-in-progress: false        # never interrupt a run mid-order

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # review mode commits auto-tuned config.yaml back
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Resolve the run mode from EITHER the manual dispatch input OR the cron schedule that
      # fired. Every step below gates on steps.mode.outputs.mode so both triggers share logic.
      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "*/5 13-19 * * 1-5") echo "mode=once" >> "$GITHUB_OUTPUT" ;;
              "35 13 * * 1-5")     echo "mode=rebound-open" >> "$GITHUB_OUTPUT" ;;
              "55 19 * * 1-5")     echo "mode=rebound-close" >> "$GITHUB_OUTPUT" ;;
              "5 20 * * 1-5")      echo "mode=summary" >> "$GITHUB_OUTPUT" ;;
              "10 20 * * 5")       echo "mode=weekly" >> "$GITHUB_OUTPUT" ;;
              "20 20 * * 1-5")     echo "mode=orb-futures" >> "$GITHUB_OUTPUT" ;;
              "30 20 * * 1-5")     echo "mode=review" >> "$GITHUB_OUTPUT" ;;
              *)                   echo "mode=healthcheck" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Daily summary
        if: ${{ steps.mode.outputs.mode == 'summary' }}
        run: python scripts/run_bot.py --summary

      - name: Weekly recap
        if: ${{ steps.mode.outputs.mode == 'weekly' }}
        run: python scripts/run_bot.py --weekly

      - name: Connectivity self-test
        if: ${{ steps.mode.outputs.mode == 'healthcheck' }}
        run: python scripts/healthcheck.py

      - name: Strategy performance report
        if: ${{ steps.mode.outputs.mode == 'strategy-report' }}
        run: python scripts/strategy_report.py --telegram

      # Pre-open news digest (add a cron-job.org entry ~9:00 AM ET, Mon-Fri).
      - name: Morning news brief
        if: ${{ steps.mode.outputs.mode == 'morning-brief' }}
        run: python scripts/morning_brief.py --telegram

      # Nightly self-improvement: analyse the day's trades, adjust strategy config
      # within guardrails (never risk rails, paper-only), run tests, and COMMIT the
      # change back so the next day's runs pick it up. Pushes a summary to Telegram.
      - name: Autonomous strategy review (apply + commit)
        if: ${{ steps.mode.outputs.mode == 'review' }}
        env:
          # Only learn from trades on/after the last strategy-code change (2026-07-09:
          # capped marketable-limit entries + news gate; before that the 07-08
          # APEX/RIPTIDE launch), so stale losses from the old execution can't
          # auto-disable a now-corrected strategy.
          EVAL_SINCE: "2026-07-09"
        run: |
          set -e
          cp config.yaml /tmp/config.before.yaml
          python scripts/review_bot.py --apply --telegram --days 14
          # Verify the bot still imports + tests pass before committing any change.
          python -m pytest tests/ -q
          if ! diff -q /tmp/config.before.yaml config.yaml >/dev/null 2>&1; then
            git config user.name "tjr-bot[bot]"
            git config user.email "tjr-bot@users.noreply.github.com"
            git add config.yaml
            git commit -m "chore(review): auto-tune strategy config [skip ci]"
            git push
            echo "config.yaml updated and committed."
          else
            echo "No config change to commit."
          fi

      - name: Trading cycle
        if: ${{ steps.mode.outputs.mode == 'once' }}
        run: python scripts/run_bot.py --once

      # AFTER-CLOSE digest (prop-firm prep + daily review) — one cron-job.org entry
      # (mode=orb-futures, ~4:20 PM ET, Mon-Fri). It:
      #   1. Updates the two futures paper ledgers SILENTLY (--no-telegram).
      #   2. Sends the per-strategy digest: THREE SEPARATE Telegram messages
      #      (🟢 LIVE stocks · 📈 FUTURES DAILY · 📈 FUTURES ORB), each listing exactly
      #      which strategy traded today and whether it made money.
      #   3. Commits the ledgers back so paper equity persists across stateless runs.
      - name: After-close digest
        if: ${{ steps.mode.outputs.mode == 'orb-futures' }}
        run: |
          set -e
          # update all paper ledgers SILENTLY; the digest is the single source of the
          # separated Telegram messages (live + stock + futures-daily + orb + crypto).
          # ORB-futures CUT 2026-08-26 (PF 0.63, -$7,348) — no longer simulated or reported.
          python scripts/futures_daily_paper.py --days 5 --no-telegram || true   # 6 futures-daily strats
          python scripts/stock_daily_paper.py --days 5 --no-telegram || true     # 3 stock-daily strats
          python scripts/crypto_daily_paper.py --days 5 --no-telegram || true    # 3 crypto-daily strats
          python scripts/daily_strategy_digest.py || true                        # sends all 5 messages
          git config user.name "tjr-bot[bot]"
          git config user.email "tjr-bot@users.noreply.github.com"
          CHANGED=""
          for f in futures_daily_ledger.json stock_daily_ledger.json crypto_daily_ledger.json; do
            if [ -n "$(git status --porcelain "$f")" ]; then git add "$f"; CHANGED="yes"; fi
          done
          if [ -n "$CHANGED" ]; then
            git commit -m "chore(sims): paper ledger update [skip ci]"
            git push
            echo "Ledgers committed."
          else
            echo "No new sim trades to record."
          fi

      # REBOUND live strategy (SPY, real-time feed) — the one validated live-tradable edge.
      # ENTER near the open: cron-job.org fires mode=rebound-open ~9:35 AM ET, Mon-Fri.
      # Enters only if REBOUND fired (2 down days) and the circuit breaker passes; idempotent.
      # PAPER unless ALPACA_PAPER=false AND REBOUND_LIVE_CONFIRM=I_UNDERSTAND are set as secrets.
      - name: REBOUND enter
        if: ${{ steps.mode.outputs.mode == 'rebound-open' }}
        env:
          REBOUND_LIVE_CONFIRM: ${{ secrets.REBOUND_LIVE_CONFIRM }}
          REBOUND_FEED: ${{ secrets.REBOUND_FEED }}
        run: python scripts/rebound_live.py --open

      # EXIT near the close: cron-job.org fires mode=rebound-close ~3:55 PM ET, Mon-Fri.
      # Unconditional flatten of any open REBOUND position (1-day hold). Safe to always run.
      - name: REBOUND exit
        if: ${{ steps.mode.outputs.mode == 'rebound-close' }}
        env:
          REBOUND_LIVE_CONFIRM: ${{ secrets.REBOUND_LIVE_CONFIRM }}
          REBOUND_FEED: ${{ secrets.REBOUND_FEED }}
        run: python scripts/rebound_live.py --close
